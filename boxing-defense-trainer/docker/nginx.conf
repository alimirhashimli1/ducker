# Boxing Defense Trainer — nginx config for the compiled SPA bundle.
#
# This is the complete config rather than a conf.d drop-in, for two reasons:
# gzip is an http-level directive, and the pid/temp paths below have to move off
# the root-owned /var tree before nginx can run as an unprivileged user.

# No `user` directive on purpose: the container already starts as `nginx`, and
# setting it here only produces a warning that nginx then ignores.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Everything nginx writes at runtime has to land somewhere the unprivileged
  # user owns. The defaults live under /var/cache/nginx, which is root-owned.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  # Logs go to the container's stdout/stderr so `docker compose logs` is the
  # single place to look.
  access_log /dev/stdout;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  # Don't advertise the nginx version in responses or error pages.
  server_tokens off;

  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # nginx does NOT inherit add_header into a location that declares its own,
    # so these three are repeated in every location below that sets a header.
    # Removing a copy silently drops the header for that route.
    #
    #   X-Content-Type-Options: stop the browser guessing a type other than the
    #     one we sent, which is how a stray upload becomes a script.
    #   X-Frame-Options: no framing, so the UI cannot be clickjacked.
    #   Referrer-Policy: send the full URL only to our own origin.
    add_header X-Content-Type-Options nosniff                  always;
    add_header X-Frame-Options        DENY                     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # Vite fingerprints every filename under /assets/, so a changed file is a
    # new URL. That makes these safe to cache permanently and never revalidate.
    # `^~` so the regex block further down cannot steal /assets/*.svg.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff                  always;
      add_header X-Frame-Options        DENY                     always;
      add_header Referrer-Policy        strict-origin-when-cross-origin always;

      try_files $uri =404;
    }

    # Files copied verbatim from public/ keep their name across deploys, so they
    # get a day rather than a year — long enough to help, short enough to fix.
    location ~* \.(?:svg|png|jpe?g|gif|ico|webp|avif|woff2?|ttf|eot)$ {
      add_header Cache-Control "public, max-age=86400" always;
      add_header X-Content-Type-Options nosniff                  always;
      add_header X-Frame-Options        DENY                     always;
      add_header Referrer-Policy        strict-origin-when-cross-origin always;

      try_files $uri =404;
    }

    # The entry point is the one file whose name never changes, and it names the
    # hashed bundles. Cached, it would pin clients to a bundle graph that no
    # longer exists, so it must be revalidated on every load.
    location = /index.html {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff                  always;
      add_header X-Frame-Options        DENY                     always;
      add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # SPA fallback: client-side routes are not files on disk, so anything that
    # isn't one is handed to index.html for the router to resolve. try_files
    # re-runs location matching, so the fallback picks up the no-cache rule
    # above rather than being cached as if it were the requested path.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
